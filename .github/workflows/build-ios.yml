name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup CocoaPods
        run: |
          sudo gem install cocoapods

      - name: Prebuild Native iOS Project
        run: npx expo prebuild --platform ios --clean

      - name: Set up CocoaPods in iOS directory
        working-directory: ios
        run: pod install

      - name: Build Xcode Archive
        working-directory: ios
        run: |
          xcodebuild -workspace HydroDark.xcworkspace \
            -scheme HydroDark \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath HydroDark.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -r HydroDark.xcarchive/Products/Applications/HydroDark.app Payload/
          zip -r HydroDark.ipa Payload
          mkdir -p ../build-output
          mv HydroDark.ipa ../build-output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HydroDark-iOS-IPA
          path: build-output/HydroDark.ipa
          retention-days: 14
