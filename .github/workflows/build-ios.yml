name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Patch ExpoModulesJSI for Swift 6.2 / Xcode 26.2
        run: node scripts/patch-expo-modules-jsi.js

      - name: Prebuild Native iOS Project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: List Xcode Schemes
        working-directory: ios
        run: xcodebuild -list

      - name: Build Xcode Archive
        working-directory: ios
        run: |
          xcodebuild -workspace HydroDark.xcworkspace \
            -scheme HydroDark \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/HydroDark.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -r build/HydroDark.xcarchive/Products/Applications/HydroDark.app Payload/
          zip -r HydroDark.ipa Payload
          mkdir -p ../build-output
          mv HydroDark.ipa ../build-output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HydroDark-iOS-IPA
          path: build-output/HydroDark.ipa
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: HydroDark v1.1.0 (iOS IPA)
          body: |
            ## HydroDark v1.1.0
            - 🖤 **Stealth Monochrome Theme**: All-black OLED & gray accents.
            - 🎨 **Multiple App Icons**: Stealth, Crimson, Frost, and Slate home screen icons.
            - 💧 **Custom Ring Center Icons**: Droplet, Flame, Energy, Glass, and Defense.
            - 🔄 **Quick In-App Updates**: Tap to download and install newer builds directly on iPhone.
            
            ### Download
            Download `HydroDark.ipa` below to install via TrollStore, AltStore, Sideloadly, or Scarlet.
          files: build-output/HydroDark.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

